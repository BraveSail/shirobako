name: Docker Image CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image (main only)
        type: boolean
        default: false

permissions: {}

jobs:
  functional:
    if: github.event_name != 'release'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run full bot and parser suites offline
        run: |
          docker buildx build --platform linux/amd64 --target functional-test --load \
            -f Dockerfile.deploy -t shirobako-functional:ci .
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges shirobako-functional:ci

  verify:
    if: github.event_name != 'release'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate manual publish
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: exit 1
      - name: Test tag promotion rules
        if: matrix.arch == 'amd64'
        run: python3 -m unittest discover -s test -p test_image_publication.py
      - name: Build and start production image
        run: |
          docker buildx build --platform "linux/$ARCH" --provenance=false --load -f Dockerfile.deploy \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "verified:$ARCH" .
          bash scripts/ci/smoke-image.sh "verified:$ARCH" "$ARCH"
      - name: Save tested image and config digest
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          docker image inspect --format '{{.Id}}' "verified:$ARCH" > "$RUNNER_TEMP/verified/config.id"
          docker image save -o "$RUNNER_TEMP/verified/image.tar" "verified:$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        with:
          name: verified-${{ matrix.arch }}
          path: ${{ runner.temp }}/verified/
          if-no-files-found: error
          overwrite: true
          retention-days: 3
          compression-level: 1

  publish:
    needs: [verify, functional]
    if: >-
      !cancelled() && github.repository == 'BraveSail/shirobako' &&
      (github.event_name == 'release' || (needs.verify.result == 'success' &&
      needs.functional.result == 'success' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))))
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    concurrency:
      group: shirobako-ghcr-writer
      queue: max
    steps:
      # Fetch current main inside the writer lock, including ancestry for reruns.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name != 'release'
        with:
          pattern: verified-*
          path: ${{ runner.temp }}/images
      - name: Install regctl
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p registry-bin
          curl --fail --silent --show-error --location --retry 3 -o registry-bin/regctl \
            https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64
          echo '3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc  registry-bin/regctl' | sha256sum --check
          chmod +x registry-bin/regctl
          echo "$RUNNER_TEMP/registry-bin" >> "$GITHUB_PATH"
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | regctl registry login ghcr.io -u "$GITHUB_ACTOR" --pass-stdin
      - name: Publish verified digest
        env:
          CI_FUNCTIONAL_RESULT: ${{ needs.functional.result }}
          CI_SMOKE_RESULT: ${{ needs.verify.result }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/ci/publish_image.py
